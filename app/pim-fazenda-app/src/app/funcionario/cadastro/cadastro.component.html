<div class="cadastro-container">
    <h2>Cadastro</h2>
    <form (ngSubmit)="cadastrar()" #cadastroForm="ngForm">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input
          type="text"
          id="usuario"
          [(ngModel)]="usuario"
          name="usuario"
          class="form-control"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          [(ngModel)]="senha"
          name="senha"
          class="form-control"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="pessoaId">Pessoa ID</label>
        <input
          type="number"
          id="pessoaId"
          [(ngModel)]="pessoaId"
          name="pessoaId"
          class="form-control"
        />
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="cadastroForm.invalid">Cadastrar</button>
    </form>
  
    <div *ngIf="erroCadastro" class="alert alert-danger">
      O cadastro falhou.
    </div>
  
    <div *ngIf="cadastroSucesso" class="alert alert-success">
      Cadastro realizado com sucesso!
    </div>
  </div>
