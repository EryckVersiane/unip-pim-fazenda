<div class="login-container">
    <h2>Login</h2>
    <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" [(ngModel)]="usuario" name="usuario" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" [(ngModel)]="senha" name="senha" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <div *ngIf="erroLogin" class="alert alert-danger">
        Usuário ou senha inválidos.
    </div>
</div>
